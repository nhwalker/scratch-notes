# =============================================================================
# Example GitLab CI/CD pipeline for a MULTI-PROJECT Gradle build whose
# subprojects are separate Java libraries, each applying `my-style-plugin`
# (e.g. via a `subprojects {}` block or a convention plugin in the root build).
#
# Copy this to `.gitlab-ci.yml` at the repo root. The plugin contributes the
# tasks used below:
#   - spotlessCheck                  (formatting: Palantir + license header)
#   - checkstyleMain / checkstyleTest (good-practice rules)
#   - compileJava / compileTestJava  (Error Prone + NullAway run inside javac)
#   - test                           (your unit tests)
#
# Multi-project notes:
#   * Running a task by simple name (e.g. `./gradlew test`) executes it in EVERY
#     subproject that has it, so the root-level invocations below fan out across
#     all the library modules. Subprojects without the task (or the root
#     aggregator) are simply skipped.
#   * Each subproject writes its reports under `<subproject>/build/...`, not the
#     root `build/`. So every report glob, artifact path and JUnit path below
#     uses `**/build/...` to collect from all modules, and the Code Quality
#     converters glob recursively and aggregate every module's findings into one
#     report per job. Paths are made relative to CI_PROJECT_DIR (the repo root =
#     the Gradle root dir), so a finding renders as `moduleA/src/main/java/...`.
#
# GitLab-native reports are produced "where appropriate":
#   - Checkstyle and SpotBugs/FindSecBugs -> Code Quality reports (MR widget +
#     inline diff annotations) by converting each tool's XML to the CodeClimate
#     JSON GitLab expects. GitLab merges the two reports.
#   - Tests -> JUnit report (shown in the MR widget and "Tests" tab).
#
# Spotless and Error Prone/NullAway are pass/fail compiler-style gates with no
# structured GitLab report format; when they fail, the details are in the job
# log and the pipeline goes red. See the comments on those jobs.
# =============================================================================

# Run one pipeline per change: on merge requests, on branches without an open
# MR, and on tags. Avoids duplicate "branch + MR" pipelines.
workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS == null'
    - if: '$CI_COMMIT_TAG'

stages:
  - build
  - quality
  - test

default:
  # JDK 21 — required by the plugin (Gradle 9.2.1 runs on a Java 17+ daemon,
  # and Error Prone/NullAway are happy on 21).
  image: eclipse-temurin:21-jdk
  # Cache the Gradle wrapper distribution and the dependency cache per branch so
  # Error Prone, NullAway, Checkstyle and JSpecify aren't re-downloaded each run.
  cache:
    key: "$CI_COMMIT_REF_SLUG"
    paths:
      - .gradle/wrapper
      - .gradle/caches
  before_script:
    - chmod +x ./gradlew

variables:
  # Keep the Gradle home inside the workspace so the cache: paths above apply.
  GRADLE_USER_HOME: "$CI_PROJECT_DIR/.gradle"
  # No daemon in CI; turn on the build cache for faster incremental jobs.
  GRADLE_OPTS: "-Dorg.gradle.daemon=false"
  GRADLE_FLAGS: "--build-cache --console=plain --stacktrace"

# -----------------------------------------------------------------------------
# Error Prone + NullAway run as part of compilation. Compiling main AND test
# sources here makes both null-safety and the Error Prone checks a hard gate.
# There is no structured GitLab report for compiler diagnostics: a violation
# fails this job and the offending file/line is printed in the job log.
# -----------------------------------------------------------------------------
compile (errorprone + nullaway):
  stage: build
  script:
    - ./gradlew $GRADLE_FLAGS classes testClasses

# -----------------------------------------------------------------------------
# Checkstyle -> GitLab Code Quality.
# `checkstyleMain`/`checkstyleTest` fan out to every module. Each writes
# <module>/build/reports/checkstyle/*.xml (even when it fails on violations), so
# we glob those recursively and convert them to one CodeClimate JSON. The
# conversion runs in after_script so it happens whether or not the task passed,
# and artifacts are uploaded `when: always` so the report still appears on a
# red pipeline (that's how reviewers see the violations in the MR).
# -----------------------------------------------------------------------------
checkstyle:
  stage: quality
  needs: []
  script:
    - ./gradlew $GRADLE_FLAGS checkstyleMain checkstyleTest
  after_script:
    - |
      # python3 is used only to convert Checkstyle XML -> CodeClimate JSON.
      # Install it if the image doesn't ship it (or bake it into a custom image).
      if ! command -v python3 >/dev/null 2>&1; then
        apt-get update -qq && apt-get install -y -qq python3
      fi
      python3 - <<'PY'
      import glob, hashlib, json, os
      import xml.etree.ElementTree as ET

      project_dir = os.environ.get("CI_PROJECT_DIR", os.getcwd())
      # Checkstyle "error" severity is our default; map to GitLab severities.
      severity = {"error": "major", "warning": "minor", "info": "info", "ignore": "info"}

      issues = []
      # Recursive glob collects every module's report (and the single-project case).
      for xml_file in glob.glob("**/build/reports/checkstyle/*.xml", recursive=True):
          for file_el in ET.parse(xml_file).getroot().findall("file"):
              # <file name> is absolute; relativize to the repo root so the path
              # renders as e.g. moduleA/src/main/java/...
              path = os.path.relpath(file_el.get("name"), project_dir)
              for err in file_el.findall("error"):
                  line = int(err.get("line", "1"))
                  source = err.get("source", "checkstyle")
                  check = source.rsplit(".", 1)[-1]
                  if check.endswith("Check"):
                      check = check[:-5]
                  message = err.get("message", check)
                  # Path is in the fingerprint, so identical findings in different
                  # modules stay distinct.
                  fingerprint = hashlib.sha256(
                      f"{path}:{line}:{source}:{message}".encode()
                  ).hexdigest()
                  issues.append({
                      "description": message,
                      "check_name": check,
                      "fingerprint": fingerprint,
                      "severity": severity.get(err.get("severity"), "minor"),
                      "location": {"path": path, "lines": {"begin": line}},
                  })

      with open("gl-code-quality-report.json", "w") as out:
          json.dump(issues, out, indent=2)
      print(f"Wrote {len(issues)} Checkstyle issue(s) to gl-code-quality-report.json")
      PY
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      # Browsable HTML/XML reports from every module.
      - "**/build/reports/checkstyle/"
    reports:
      codequality: gl-code-quality-report.json

# -----------------------------------------------------------------------------
# SpotBugs + FindSecBugs -> GitLab Code Quality.
# SpotBugs runs advisory (the plugin sets ignoreFailures = true), so it always
# produces reports rather than failing the job. `spotbugsMain`/`spotbugsTest`
# fan out to every module; we glob <module>/build/reports/spotbugs/*.xml
# recursively, keep the HTML/XML/SARIF as artifacts, and convert to CodeClimate
# JSON for the MR widget. GitLab merges this report with the Checkstyle one.
# (SpotBugs gives each finding a stable instanceHash; we prefix it with the file
# path so the fingerprint stays unique across modules. Security findings are
# surfaced at >= major severity.)
# -----------------------------------------------------------------------------
spotbugs:
  stage: quality
  needs: []
  script:
    - ./gradlew $GRADLE_FLAGS spotbugsMain spotbugsTest
  after_script:
    - |
      if ! command -v python3 >/dev/null 2>&1; then
        apt-get update -qq && apt-get install -y -qq python3
      fi
      python3 - <<'PY'
      import glob, json, os
      import xml.etree.ElementTree as ET

      project_dir = os.environ.get("CI_PROJECT_DIR", os.getcwd())

      def severity_for(rank, category):
          try:
              rank = int(rank)
          except (TypeError, ValueError):
              rank = 20
          sev = "critical" if rank <= 4 else "major" if rank <= 9 else "minor" if rank <= 14 else "info"
          if category == "SECURITY" and sev in ("minor", "info"):
              sev = "major"  # make FindSecBugs findings stand out
          return sev

      issues = []
      # Recursive glob collects every module's report (and the single-project case).
      for xml_file in glob.glob("**/build/reports/spotbugs/*.xml", recursive=True):
          root = ET.parse(xml_file).getroot()
          srcdirs = [e.text for e in root.findall("./Project/SrcDir") if e.text]
          for bug in root.findall("BugInstance"):
              lines = bug.findall(".//SourceLine")
              sl = next((s for s in lines if s.get("primary") == "true" and s.get("start")), None) \
                  or next((s for s in lines if s.get("start")), None)
              if sl is None:
                  continue
              sourcepath = sl.get("sourcepath", "")
              # SpotBugs sourcepath is package-relative; resolve against the source
              # roots it recorded (per module), then make it repo-relative.
              path = sourcepath
              for d in srcdirs:
                  cand = os.path.join(d, sourcepath)
                  if os.path.exists(cand):
                      path = os.path.relpath(cand, project_dir)
                      break
              lm = bug.find("LongMessage")
              desc = lm.text if lm is not None and lm.text else bug.get("type", "SpotBugs finding")
              instance = bug.get("instanceHash") or f"{sl.get('start')}:{bug.get('type')}"
              issues.append({
                  "description": desc,
                  "check_name": bug.get("type"),
                  "categories": [bug.get("category", "BUG")],
                  # Prefix with path so identical findings in different modules differ.
                  "fingerprint": f"{path}:{instance}",
                  "severity": severity_for(bug.get("rank"), bug.get("category")),
                  "location": {"path": path, "lines": {"begin": int(sl.get("start", "1"))}},
              })

      with open("gl-code-quality-report.json", "w") as out:
          json.dump(issues, out, indent=2)
      print(f"Wrote {len(issues)} SpotBugs issue(s) to gl-code-quality-report.json")
      PY
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      # Browsable HTML + machine-readable XML + SARIF from every module.
      - "**/build/reports/spotbugs/"
    reports:
      codequality: gl-code-quality-report.json

# -----------------------------------------------------------------------------
# Spotless: formatting gate. No structured GitLab report exists for it.
# If this fails, the fix is to run `./gradlew spotlessApply` locally and commit.
# spotlessCheck prints exactly which files differ in the job log.
# -----------------------------------------------------------------------------
spotless:
  stage: quality
  needs: []
  script:
    - ./gradlew $GRADLE_FLAGS spotlessCheck
  # Make the remediation obvious in the log when the job fails.
  after_script:
    - >
      if [ "$CI_JOB_STATUS" = "failed" ]; then
        echo "Formatting check failed. Run './gradlew spotlessApply' locally and commit the result.";
      fi

# -----------------------------------------------------------------------------
# Unit tests -> GitLab JUnit report (MR widget + "Tests" tab).
# `test` fans out to every module; collect each module's results recursively.
# -----------------------------------------------------------------------------
test:
  stage: test
  needs: ["compile (errorprone + nullaway)"]
  script:
    - ./gradlew $GRADLE_FLAGS test
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - "**/build/reports/tests/"
    reports:
      junit:
        - "**/build/test-results/test/**/TEST-*.xml"
