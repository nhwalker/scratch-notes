# Phase 0 spikes for the VM Testcontainer plan (docs/vm-testcontainer/PLAN.md).
# Runs every feature check against a Rocky 9 guest with real KVM (and TCG for comparison) using rootless Podman,
# plus a Java Testcontainers -> Podman compat-API probe for /dev/kvm passthrough and group handling.
name: vm-testcontainer-spikes

on:
  pull_request:
    paths:
      - "vm-testcontainer/**"
      - ".github/workflows/vm-testcontainer-spikes.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  ROCKY_IMAGE: Rocky-9-GenericCloud-Base-9.8-20260525.0.x86_64.qcow2
  ROCKY_SHA256: 92c206cc6f790c61583247eefe87890f8828420662c17cacf247cec78ab4eec8
  SPIKE_DIR: vm-testcontainer/container/spike
  IMAGE: localhost/vmtc-spike:media

jobs:
  vm-spikes:
    name: vm-spikes (${{ matrix.os }}, ${{ matrix.accel }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, accel: kvm }
          - { os: ubuntu-24.04, accel: tcg }
          - { os: ubuntu-26.04, accel: kvm }
    steps:
      - uses: actions/checkout@v4

      - name: Host facts
        run: |
          set -x
          nproc; free -g; df -h / | tail -1; uname -r
          ls -l /dev/kvm || true
          podman --version; podman info --format '{{.Host.OCIRuntime.Name}} {{.Host.OCIRuntime.Version}} rootless={{.Host.Security.Rootless}} cgroup={{.Host.CgroupsVersion}} net={{.Host.NetworkBackend}}'
          id; echo "XDG_RUNTIME_DIR=${XDG_RUNTIME_DIR:-unset}"

      - name: Enable /dev/kvm for the runner user (0666)
        if: matrix.accel == 'kvm'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      - name: Build spike image (rootless podman, UBI 9.8 + EPEL + Rocky fallback)
        run: |
          start=$(date +%s)
          podman build -f "$SPIKE_DIR/Containerfile.spike" --build-arg VARIANT=media -t "$IMAGE" "$SPIKE_DIR"
          echo "build_seconds=$(( $(date +%s) - start ))" | tee -a "$GITHUB_STEP_SUMMARY"
          podman image ls "$IMAGE"
          podman run --rm "$IMAGE" bash -c 'rpm -qa --qf "%{NAME}-%{VERSION}-%{RELEASE}\n" | grep -E "^(qemu-kvm-core|gstreamer1|gstreamer1-plugins-(base|good|bad-free))-" | sort'

      - name: Restore Rocky guest image
        id: cache-rocky
        uses: actions/cache@v4
        with:
          path: ~/vm-images
          key: rocky-${{ env.ROCKY_SHA256 }}

      - name: Download Rocky guest image
        if: steps.cache-rocky.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/vm-images
          curl -fsSL --retry 5 -o ~/vm-images/$ROCKY_IMAGE "https://dl.rockylinux.org/pub/rocky/9/images/x86_64/$ROCKY_IMAGE"

      - name: Verify guest image checksum
        run: echo "$ROCKY_SHA256  $HOME/vm-images/$ROCKY_IMAGE" | sha256sum -c -

      - name: Generate cloud-init seed
        run: SEED_PACKAGES=alsa-utils "$SPIKE_DIR/make-seed.sh"

      - name: Run VM spikes
        run: |
          python3 "$SPIKE_DIR/ci_spikes.py" --engine podman --image "$IMAGE" \
            --disk "$HOME/vm-images/$ROCKY_IMAGE" --accel "${{ matrix.accel }}" --out "out-${{ matrix.os }}-${{ matrix.accel }}" \
            --boot-timeout 2400

      - name: Publish results
        if: always()
        run: cat "out-${{ matrix.os }}-${{ matrix.accel }}/results.md" >> "$GITHUB_STEP_SUMMARY" || true

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vm-spikes-${{ matrix.os }}-${{ matrix.accel }}
          path: out-${{ matrix.os }}-${{ matrix.accel }}/
          retention-days: 14

  guest-build:
    name: guest-build (reference guest pipeline, KVM)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Enable /dev/kvm (0666)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm

      - name: Build spike image
        run: podman build -f "$SPIKE_DIR/Containerfile.spike" --build-arg VARIANT=media -t "$IMAGE" "$SPIKE_DIR"

      - name: Restore Rocky guest image
        id: cache-rocky
        uses: actions/cache@v4
        with:
          path: ~/vm-images
          key: rocky-${{ env.ROCKY_SHA256 }}

      - name: Download Rocky guest image
        if: steps.cache-rocky.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/vm-images
          curl -fsSL --retry 5 -o ~/vm-images/$ROCKY_IMAGE "https://dl.rockylinux.org/pub/rocky/9/images/x86_64/$ROCKY_IMAGE"
          echo "$ROCKY_SHA256  $HOME/vm-images/$ROCKY_IMAGE" | sha256sum -c -

      - name: Customize + flatten + package containerDisk
        run: |
          "$SPIKE_DIR/build-guest.sh" podman "$IMAGE" "$HOME/vm-images/$ROCKY_IMAGE" "$HOME/guest-work" localhost/vmtc-guest:spike kvm \
            2>&1 | tee guest-build.log

      - name: Boot the customized guest WITHOUT a seed and run all checks
        run: |
          python3 "$SPIKE_DIR/ci_spikes.py" --engine podman --image "$IMAGE" --no-seed \
            --disk "$HOME/guest-work/run/rocky9-vmtc.qcow2" --accel kvm --out out-guest-noseed

      - name: Publish results
        if: always()
        run: |
          { echo '### guest-build'; echo '```'; grep -E "seconds=|DNF_RC|CUSTOMIZE_DONE|qcow2|localhost/vmtc-guest" guest-build.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY" || true
          cat out-guest-noseed/results.md >> "$GITHUB_STEP_SUMMARY" || true
          cp guest-build.log out-guest-noseed/ 2>/dev/null || true
          cp "$HOME/guest-work/run/customize-serial.log" out-guest-noseed/ 2>/dev/null || true

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: guest-build
          path: out-guest-noseed/
          retention-days: 14

  compat-api-probe:
    name: compat-api-probe (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-26.04]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Podman facts
        run: |
          podman --version
          podman info --format '{{.Host.OCIRuntime.Name}} {{.Host.OCIRuntime.Version}} rootless={{.Host.Security.Rootless}}'

      - name: Build spike image
        run: podman build -f "$SPIKE_DIR/Containerfile.spike" --build-arg VARIANT=slim -t "$IMAGE" "$SPIKE_DIR"

      - name: "Scenario A: /dev/kvm 0666"
        run: vm-testcontainer/spike-java/run-scenario.sh A 0666

      - name: "Scenario B: /dev/kvm 0660 root:kvm, service started with kvm group"
        run: vm-testcontainer/spike-java/run-scenario.sh B 0660

      - name: "Scenario C: as B + containers.conf annotation run.oci.keep_original_groups=1"
        run: vm-testcontainer/spike-java/run-scenario.sh C 0660 containers-keepgroups.conf

      - name: Publish results
        if: always()
        run: |
          for f in probe-*.txt; do
            echo "### ${{ matrix.os }} $f" >> "$GITHUB_STEP_SUMMARY"; echo '```' >> "$GITHUB_STEP_SUMMARY"
            cat "$f" >> "$GITHUB_STEP_SUMMARY"; echo '```' >> "$GITHUB_STEP_SUMMARY"
          done

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compat-api-probe-${{ matrix.os }}
          path: probe-*.txt
          retention-days: 14
